# ShitcoinBtc release builds: produces node + wallet CLI binaries for
# Linux, macOS, and Windows on every push to master (and on demand).
# The `build-qt` job additionally produces the Qt desktop wallet
# (dark gold Shitcoin theme) per OS. Binaries are uploaded as workflow
# artifacts, ready to download.
name: Build binaries

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04
          - os: macos
            runner: macos-14
          - os: windows
            runner: ubuntu-24.04 # cross-compiled via depends + mingw (needs newer mingw GCC for C++20)

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake \
            pkg-config bsdmainutils python3 libssl-dev libevent-dev \
            libboost-all-dev libsqlite3-dev libdb5.3++-dev libminiupnpc-dev libzmq3-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos'
        run: |
          brew install automake libtool pkgconf libevent boost sqlite \
            openssl@3 berkeley-db@5 miniupnpc zeromq gmp
          echo "CPPFLAGS=-I$(brew --prefix berkeley-db@5)/include -I$(brew --prefix openssl@3)/include -I$(brew --prefix gmp)/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix berkeley-db@5)/lib -L$(brew --prefix openssl@3)/lib -L$(brew --prefix gmp)/lib" >> "$GITHUB_ENV"

      - name: Build dependencies (Windows cross-compile)
        if: matrix.os == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake \
            pkg-config bsdmainutils curl python3 g++-mingw-w64-x86-64
          cd depends
          make HOST=x86_64-w64-mingw32 -j$(nproc)

      - name: Configure and build (Linux/macOS)
        if: matrix.os != 'windows'
        run: |
          echo "=== autogen ==="
          ./autogen.sh
          echo "=== configure ==="
          ./configure --without-gui --disable-tests --disable-bench
          echo "=== make ==="
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Configure and build (Windows)
        if: matrix.os == 'windows'
        run: |
          ./autogen.sh
          CONFIG_SITE="$PWD/depends/x86_64-w64-mingw32/share/config.site" \
            ./configure --prefix=/ --without-gui --disable-tests --disable-bench
          make -j$(nproc)

      - name: Collect binaries
        shell: bash
        env:
          EXE: ${{ matrix.os == 'windows' && '.exe' || '' }}
        run: |
          mkdir -p dist
          for b in src/syscoind src/syscoin-node src/syscoin-cli src/syscoin-tx src/syscoin-wallet; do
            if [ -f "$b$EXE" ]; then cp "$b$EXE" dist/; fi
          done
          ls -la dist/

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: shitcoin-${{ matrix.os }}
          path: dist/

  # Qt desktop wallet (Shitcoin dark-gold theme). Separate job so a GUI
  # build issue can never block the node/CLI artifacts above.
  build-qt:
    name: qt-${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04
          - os: macos
            runner: macos-14
          - os: windows
            runner: ubuntu-24.04 # cross-compiled via depends + mingw (needs newer mingw GCC for C++20)

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake \
            pkg-config bsdmainutils python3 libssl-dev libevent-dev \
            libboost-all-dev libsqlite3-dev libdb5.3++-dev libminiupnpc-dev libzmq3-dev \
            qtbase5-dev qttools5-dev qttools5-dev-tools libqt5svg5-dev libqrencode-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos'
        run: |
          brew install automake libtool pkgconf libevent boost sqlite \
            openssl@3 berkeley-db@5 miniupnpc zeromq gmp qt@5
          echo "CPPFLAGS=-I$(brew --prefix berkeley-db@5)/include -I$(brew --prefix openssl@3)/include -I$(brew --prefix gmp)/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix berkeley-db@5)/lib -L$(brew --prefix openssl@3)/lib -L$(brew --prefix gmp)/lib" >> "$GITHUB_ENV"
          echo "PATH=$(brew --prefix qt@5)/bin:$PATH" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix qt@5)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build dependencies (Windows cross-compile)
        if: matrix.os == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake \
            pkg-config bsdmainutils curl python3 g++-mingw-w64-x86-64
          cd depends
          make HOST=x86_64-w64-mingw32 -j$(nproc)

      - name: Configure and build (Linux/macOS)
        if: matrix.os != 'windows'
        run: |
          echo "=== autogen ==="
          ./autogen.sh
          echo "=== configure ==="
          ./configure --with-gui=qt5 --disable-tests --disable-bench
          echo "=== make ==="
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Configure and build (Windows)
        if: matrix.os == 'windows'
        run: |
          ./autogen.sh
          CONFIG_SITE="$PWD/depends/x86_64-w64-mingw32/share/config.site" \
            ./configure --prefix=/ --with-gui=qt5 --disable-tests --disable-bench
          make -j$(nproc)

      - name: Collect Qt wallet
        shell: bash
        env:
          EXE: ${{ matrix.os == 'windows' && '.exe' || '' }}
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "linux" ]; then
            # Strip the 400MB+ unstripped binary down to shippable size.
            strip src/qt/syscoin-qt
          fi
          cp "src/qt/syscoin-qt$EXE" dist/
          ls -la dist/

      - name: Bundle macOS Qt app (macdeployqt)
        if: matrix.os == 'macos'
        run: |
          QT_BIN="$(brew --prefix qt@5)/bin"
          APP="dist/Shitcoin-Qt.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp src/qt/syscoin-qt "$APP/Contents/MacOS/Shitcoin-Qt"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>Shitcoin-Qt</string>
            <key>CFBundleIdentifier</key><string>xyz.shitcoinbtc.shitcoin-qt</string>
            <key>CFBundleName</key><string>Shitcoin-Qt</string>
            <key>CFBundleVersion</key><string>1.0.1</string>
            <key>CFBundleShortVersionString</key><string>1.0.1</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          "$QT_BIN/macdeployqt" "$APP" -verbose=1
          echo "=== bundled libs ==="
          find "$APP/Contents/Frameworks" -name '*.dylib' | head -20
          cd dist && rm -f syscoin-qt && zip -ry "shitcoin-qt-v1.0.1-macos.zip" "Shitcoin-Qt.app"
          ls -la

      - name: Upload Qt wallet
        uses: actions/upload-artifact@v4
        with:
          name: shitcoin-qt-${{ matrix.os }}
          path: dist/
